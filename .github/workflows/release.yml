name: Release

# Tag pushes (v*) build, test and publish a GitHub release. workflow_dispatch builds and uploads
# workflow artifacts only; it never publishes, even when run on a tag ref.
#
# Versions: a tag v0.1.0-pre.1 releases version 0.1.0-pre.1 as a prerelease (any '-' suffix).
# Tags without a suffix publish a normal release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver for the build, e.g. 0.1.0-pre.1 (default: 0.0.0-ci.<run number>)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Native tests and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify original bitmap bytes
        run: python3 tools/arduino/convert_assets.py --check
      - name: Manifest and ELF tool unit tests
        run: python3 -m unittest discover -s tools/arduino/tests -v
      - name: Module tables are current (gen_registry --check)
        run: python3 -I tools/modules/gen_registry.py --check
      - name: Module generator and scaffold unit tests
        run: python3 -I -m unittest discover -s tools/modules/tests -v
      - name: Configure (Release)
        run: cmake -S tests/native -B build/native-rel -DCMAKE_BUILD_TYPE=Release
      - name: Build (Release)
        run: cmake --build build/native-rel --parallel
      - name: Run (Release)
        run: ctest --test-dir build/native-rel --output-on-failure
      - name: Configure (ASan/UBSan)
        run: cmake -S tests/native -B build/native-asan -DCMAKE_BUILD_TYPE=Debug -DORBIT_NATIVE_ASAN_UBSAN=ON
      - name: Build (ASan/UBSan)
        run: cmake --build build/native-asan --parallel
      - name: Run (ASan/UBSan)
        run: ctest --test-dir build/native-asan --output-on-failure

  firmware:
    name: Firmware (${{ inputs.version || github.ref_name }})
    needs: test
    runs-on: ubuntu-latest
    env:
      ORBIT_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          v="${ORBIT_RELEASE_VERSION:-}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${v#v}"
          elif [[ -z "$v" ]]; then
            v="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $v"
      - name: Cache Arduino toolchain, platform and libraries
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            tools/arduino/.tool-cache/arduino-cli-1.5.1
            tools/arduino/.tool-cache/data
          key: arduino-${{ runner.os }}-${{ hashFiles('firmware/Orbit12/sketch.yaml', 'tools/arduino/bootstrap.sh') }}
      - name: Install pinned arduino-cli, core and libraries
        run: bash tools/arduino/bootstrap.sh
      - name: Build firmware, ELF check, size gates and release manifest
        env:
          ORBIT_REPO: ${{ github.repository }}
        run: bash tools/arduino/build-firmware.sh --version "${{ steps.version.outputs.version }}"
      - name: Verify the build restored the committed build identity header
        run: git diff --exit-code -- firmware/Orbit12/src/app/build_info.hpp
      - name: Require the release manifest and UF2
        run: |
          set -euo pipefail
          dist=tools/arduino/.tool-cache/artifacts/release/dist
          test -f "$dist/release-manifest.json"
          test -f "$dist/SHA256SUMS"
          test -f "$dist/Orbit12-${{ steps.version.outputs.version }}.uf2"
          cat "$dist/release-manifest.json"
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbit12-firmware-${{ steps.version.outputs.version }}
          path: |
            tools/arduino/.tool-cache/artifacts/release/dist/*
            tools/arduino/.tool-cache/artifacts/release/compile.log
          if-no-files-found: error

  installer:
    name: Installer (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            ext: .exe
          - os: macos-latest
            label: macos
            ext: ""
          - os: ubuntu-latest
            label: linux
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The installer is delivered separately. Until tools/installer/build_exe.py exists this job
      # reports a skip instead of failing, so firmware releases are not blocked by it.
      - name: Check for installer build script
        id: check
        shell: bash
        run: |
          if [[ -f tools/installer/build_exe.py ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tools/installer/build_exe.py not present yet; installer skipped for ${{ matrix.label }}"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.check.outputs.present == 'true'
        with:
          python-version: "3.11"
      - name: Build installer executable
        if: steps.check.outputs.present == 'true'
        shell: bash
        env:
          # Contract with the installer build script: it writes exactly one executable into this folder.
          ORBIT_INSTALLER_OUT: ${{ github.workspace }}/installer-out
        run: |
          set -euo pipefail
          mkdir -p "$ORBIT_INSTALLER_OUT"
          python tools/installer/build_exe.py
          count=$(find "$ORBIT_INSTALLER_OUT" -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "$count" != "1" ]]; then
            echo "error: expected one installer executable in $ORBIT_INSTALLER_OUT, found $count" >&2
            exit 1
          fi
      - name: Rename installer executable
        if: steps.check.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          src="$(find "$ORBIT_INSTALLER_OUT" -maxdepth 1 -type f | head -n 1)"
          mkdir -p staged
          cp "$src" "staged/orbit12-installer-${{ matrix.label }}${{ matrix.ext }}"
        env:
          ORBIT_INSTALLER_OUT: ${{ github.workspace }}/installer-out
      - name: Upload installer
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbit12-installer-${{ matrix.label }}
          path: staged/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    # Tags only, from a push event. Manual runs never reach this job.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, firmware, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Assemble release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          # Firmware: the UF2, manifest and the firmware SHA256SUMS (regenerated over all assets below).
          find release-assets -maxdepth 2 -type f \( -name 'Orbit12-*.uf2' -o -name 'release-manifest.json' \) -exec cp {} publish/ \;
          find release-assets -maxdepth 2 -type f -name 'orbit12-installer-*' -exec cp {} publish/ \;
          for required in publish/release-manifest.json publish/Orbit12-*.uf2; do
            [[ -e "$required" ]] || { echo "error: missing $required" >&2; exit 1; }
          done
          ( cd publish && sha256sum $(ls | grep -v '^SHA256SUMS$') > SHA256SUMS )
          cat publish/SHA256SUMS
          ls -l publish
      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          args=(--title "Orbit12 ${TAG#v}" --generate-notes --verify-tag)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" publish/* "${args[@]}"
